[build]
builder = "NIXPACKS"
# npm install (not ci) — Railway's BuildKit cache-mounts
# /app/node_modules/.cache, which npm ci can't rmdir during its
# clean-slate install. install is a drop-in replacement for ci
# when package-lock.json is committed (which it is).
buildCommand = "npm install --no-audit --no-fund && npm run build"

[deploy]
startCommand = "node ./dist/server/entry.mjs"
healthcheckPath = "/"
# 30s was too tight: on 2026-10-03 a good build failed because the server
# started listening right as the window closed. Give a cold boot room.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
